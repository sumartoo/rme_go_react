# Production stack, copied to the server by .github/workflows/ci-cd.yml.
# The images come from GitHub Container Registry; the database is the
# PostgreSQL installed on the server itself (DATABASE_URL in .env).
#
# Settings live in .env next to this file on the server (see deploy/.env.example).
# The workflow sets IMAGE_PREFIX and IMAGE_TAG there after each deploy.
services:
  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_TTL: ${JWT_TTL:-15m}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      # Stok Farmasi > Analitik AI assistant; empty key = assistant off
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT: ${AI_TIMEOUT:-120s}
    # Same check as the Dockerfile, plus a grace period for the database retries
    # and migrations at startup (a fresh database runs all of them).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    # Lets the container reach PostgreSQL on the server as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only reachable from the server itself; browsers go through the frontend's /api proxy.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Behind a reverse proxy on the server (nginx/Caddy terminating HTTPS), listen on
    # 127.0.0.1 only: a port Docker publishes on 0.0.0.0 bypasses UFW. Set
    # FRONTEND_BIND=0.0.0.0 in .env only to serve the app directly without a proxy.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
