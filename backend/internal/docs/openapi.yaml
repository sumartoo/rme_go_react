    get:
      tags: [report-klinik]
      summary: Report Diagnosa, every diagnosis of the sales at your branches
      description: >-
        One row per diagnosis (trxjualdiagnosa), newest sale first, with the patient, the sale's
        prescription ("DRUG (qty) , DRUG (qty)") and the visit's main complaint
        (trxpemeriksaan.keluhan_utama); usia is the age in years on the visit day. A sale with two
        diagnoses has two rows. The legacy Saturasi Oksigen is not stored in this database.
      operationId: reportDiagnosa
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cabang, in: query, description: One of your branches (403 otherwise), schema: { type: string } }
        - { name: q, in: query, description: 'Patient, No RM, ICD code or name, doctor, complaint, branch or sale id', schema: { type: string } }
        - { name: nama, in: query, description: Patient name (Cari panel), schema: { type: string } }
        - { name: diagnosa, in: query, description: ICD code or name (Cari panel), schema: { type: string } }
        - { name: pelayanan, in: query, description: refjenisrawat id (Cari panel), schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [idJual, tgl, noRm, pasien, tglLahir, usia, jenisKelamin, dokter, jenisRawat, icd, diagnosa, cabang], default: idJual } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 5 } }
      responses:
        '200':
          description: One page of diagnoses
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: trxjualdiagnosa id }
                        idJual: { type: integer }
                        tgl: { type: string, example: '2026-11-20 14:30:38' }
                        noRm: { type: string }
                        pasien: { type: string }
                        tglLahir: { type: string, format: date, nullable: true }
                        usia: { type: integer, nullable: true }
                        jenisKelamin: { type: string }
                        dokter: { type: string }
                        jenisRawat: { type: string }
                        icd: { type: string, example: J06 }
                        diagnosa: { type: string }
                        resep: { type: string }
                        keluhan: { type: string }
                        cabang: { type: string }
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/report-klinik/diagnosa/options:
    get:
      tags: [report-klinik]
      summary: Services, your branches and today's clinic date, for Report Diagnosa
      operationId: reportDiagnosaOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Options, as GET /api/report-klinik/pendapatan/options
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/report-klinik/icd-dinkes:
    get:
      tags: [report-klinik]
      summary: Report ICD Dinkes, the cases per ICD code and service at your branches, by age group and sex
      description: >-
        One row per ICD code and service (refjenisrawat): the diagnoses (trxjualdiagnosa) of the
        non-cancelled sales in the period, counted by the patient's age on the visit day (0-7 days,
        8-28 days, 1-11 months, 1-4, 5-9, 10-14, 15-19, 20-44, 45-59 and over 59 years) and by sex
        (refgender 1 Laki-laki, 2 Perempuan). A patient without a birth date is in no age group but in
        the total. Highest code first.
      operationId: reportIcdDinkes
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cabang, in: query, description: One of your branches (403 otherwise); all of them when omitted, schema: { type: string } }
        - { name: q, in: query, description: 'ICD code or name, or service', schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [kode, icd, jenisRawat, hari0_7, hari8_28, bulan1_11, tahun1_4, tahun5_9, tahun10_14, tahun15_19, tahun20_44, tahun45_59, tahun60, laki, perempuan, total], default: kode } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 10 } }
      responses:
        '200':
          description: One page of ICD lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        kode: { type: string, example: R51 }
                        icd: { type: string, example: HEADACHE (CEPHALGIA) }
                        jenisRawat: { type: string, example: POLI UMUM }
                        hari0_7: { type: integer }
                        hari8_28: { type: integer }
                        bulan1_11: { type: integer }
                        tahun1_4: { type: integer }
                        tahun5_9: { type: integer }
                        tahun10_14: { type: integer }
                        tahun15_19: { type: integer }
                        tahun20_44: { type: integer }
                        tahun45_59: { type: integer }
                        tahun60: { type: integer, description: Over 59 years }
                        laki: { type: integer }
                        perempuan: { type: integer }
                        total: { type: integer }
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/report-klinik/icd-dinkes/options:
    get:
      tags: [report-klinik]
      summary: Your branches and today's clinic date, for Report ICD Dinkes
      operationId: reportIcdDinkesOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches: { type: array, items: { type: object, properties: { kode: { type: string }, nama: { type: string } } } }
                  today: { type: string, format: date }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/penerimaan-barang:
    get:
      tags: [transaksi-klinik]
      summary: List goods receipts (Penerimaan Barang) at your branches, newest first
      description: >-
        One row per receipt (trxfaktur): No GR is no_fak, Tgl Trans the entry date (tgl), Tgl GR the
        receipt date (tgl_fak); supplier is empty when id_supp is 0; total from trxfakturtotal. The
        dates filter the entry date (clinic dates, default today).
      operationId: listPenerimaanBarang
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cabang, in: query, description: One of your branches (403 otherwise), schema: { type: string } }
        - { name: q, in: query, description: 'No GR, supplier, branch or receipt number', schema: { type: string } }
        - { name: noGr, in: query, description: No GR (Cari panel), schema: { type: string } }
        - { name: supplier, in: query, description: refsupplier id (Cari panel); 0 = no supplier, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [id, noGr, tglTrans, tglGr, supplier, total, cabang], default: id } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 10 } }
      responses:
        '200':
          description: One page of receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: No }
                        noGr: { type: string, example: PM/11/20/2026 }
                        tglTrans: { type: string, format: date, nullable: true }
                        tglGr: { type: string, format: date, nullable: true }
                        supplier: { type: string, description: Empty when none }
                        total: { type: number }
                        cabang: { type: string }
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [transaksi-klinik]
      summary: Save a goods receipt and add its drugs to the branch stock
      description: >-
        Records trxfaktur (tgl now, tgl_fak and tgl_jtp = tglGr, id_supp 0, id_jenis_byr 1), one
        trxfakturobat line per drug with the branch's buying price (trxstock.hbeli) and tot_qjb = byk,
        and trxfakturtotal (total = sum of hbeli x byk x (1 - disc/100), fully paid, status 1,
        no_close = YYMM + id); then adds each byk to the branch stock (trxstock.stok). All in one
        transaction. noBatch defaults to "0".
      operationId: savePenerimaanBarang
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cabang, idDistributor, noGr, tglGr, obat]
              properties:
                cabang: { type: string, description: One of your branches (403 otherwise) }
                idDistributor: { type: integer, description: refdistributorobat id }
                noGr: { type: string, maxLength: 15 }
                tglGr: { type: string, format: date, description: Not after today }
                obat:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required: [idObat, byk, tglExp]
                    properties:
                      idObat: { type: integer, description: A drug stocked at the branch }
                      noBatch: { type: string, maxLength: 20 }
                      byk: { type: number, exclusiveMinimum: 0 }
                      tglExp: { type: string, format: date }
                      disc: { type: number, minimum: 0, maximum: 100, description: Percent }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: No Trans }
                  total: { type: number }
                  noClose: { type: integer, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/penerimaan-barang/options:
    get:
      tags: [transaksi-klinik]
      summary: Suppliers, your branches and today's clinic date, for Penerimaan Barang
      operationId: penerimaanBarangOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppliers: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
                  branches: { type: array, items: { type: object, properties: { kode: { type: string }, nama: { type: string } } } }
                  today: { type: string, format: date }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/penerimaan-barang/distributor:
    get:
      tags: [transaksi-klinik]
      summary: Distributors (refdistributorobat) for the receipt form's lookup
      operationId: penerimaanBarangDistributor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Distributors by id
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { type: object, properties: { id: { type: integer }, nama: { type: string }, alamat: { type: string } } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/penerimaan-barang/obat:
    get:
      tags: [transaksi-klinik]
      summary: The drugs stocked at one of your branches, with buying price and stock, for the receipt form's lookup
      operationId: penerimaanBarangObat
      security:
        - bearerAuth: []
      parameters:
        - { name: cabang, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Drugs by id
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nama: { type: string }
                        jenis: { type: string }
                        satuan: { type: string, description: The selling unit }
                        harga: { type: number, description: trxstock.hbeli }
                        stok: { type: number }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/penerimaan-barang/detail/{id}:
    parameters:
      - { name: id, in: path, required: true, description: trxfaktur id (No Trans), schema: { type: integer } }
    get:
      tags: [transaksi-klinik]
