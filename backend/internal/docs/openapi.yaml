  /api/pengobatan:
    post:
      tags: [transaksi-klinik]
      summary: Save a treatment sale from the Pengobatan form
      description: >-
        One transaction. Writes trxjual (no_kwi = YYMM + branch + 4-digit number per
        branch and month), trxjualtotal (status 1 Close), the lines (trxjualobat,
        trxjualtindakan, trxjualpnjng, trxjualdiagnosa), lowers trxstock, and sets the
        registration to CLOSE. Prices come from the master data at the branch; only an
        editable procedure price (reftindakan.isedit) is taken from the request. Drug
        lines are rounded up to 500 (PPN 10% for taxable drugs); procedures and
        examinations are not. pembayaran is the money handed over (default: the amount
        due), cicilan the settled part, piutang what stays owed.
      operationId: savePengobatan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cabang, tglKwi, idKun, idJenisRawat, idJenisBayar, idDokter]
              properties:
                cabang: { type: string }
                tglKwi: { type: string, format: date }
                idKun: { type: integer, description: trxpendaftaran id }
                idJenisRawat: { type: integer }
                idJenisBayar: { type: integer }
                idDokter: { type: integer }
                obat: { type: array, items: { type: object, properties: { idObat: { type: integer }, byk: { type: number }, dosis: { type: string, maxLength: 100 } } } }
                tindakan: { type: array, items: { type: object, properties: { idTindakan: { type: integer }, byk: { type: number }, harga: { type: number, nullable: true } } } }
                penunjang: { type: array, items: { type: object, properties: { idPenunjang: { type: integer }, byk: { type: number } } } }
                diagnosa: { type: array, items: { type: integer } }
                diskon: { type: number }
                payment: { type: number, nullable: true }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  noKwi: { type: string, example: 2611CTM0312 }
                  totObat: { type: number }
                  totTindakan: { type: number }
                  totPenunjang: { type: number }
                  total: { type: number }
                  potongan: { type: number }
                  grandTotal: { type: number }
                  pembayaran: { type: number }
                  cicilan: { type: number }
                  piutang: { type: number }
                  kembalian: { type: number }
        '400':
