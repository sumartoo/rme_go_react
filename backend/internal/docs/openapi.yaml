                  idDistributor: { type: integer, nullable: true }
                  distributor: { type: string }
                  supplier: { type: string }
                  createUser: { type: string }
                  total: { type: number }
                  obat:
                    type: array
                    items:
                      type: object
                      properties:
                        idObat: { type: integer }
                        nama: { type: string }
                        jenis: { type: string }
                        satuan: { type: string }
                        harga: { type: number }
                        noBatch: { type: string }
                        byk: { type: number }
                        tglExp: { type: string, format: date, nullable: true }
                        disc: { type: number }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pengobatan/pendaftaran:
    get:
      tags: [transaksi-klinik]
      summary: Registrations of one branch that a treatment can still be recorded for
      description: >-
        The Pengobatan form lookup ("Data Pendaftaran"). Lists registrations with
        status DAFTAR, PROSES or PAYMENT that no sale refers to yet, newest first.
        Dokter PJ is the examination doctor (trxpemeriksaan.id_dok); services
        without an examination get the branch NON DOKTER; null when not chosen.
      operationId: pengobatanPendaftaran
      security:
        - bearerAuth: []
      parameters:
        - { name: cabang, in: query, required: true, description: One of your branches (403 otherwise), schema: { type: string } }
        - { name: from, in: query, description: Default yesterday (clinic date), schema: { type: string, format: date } }
        - { name: to, in: query, description: Default today (clinic date), schema: { type: string, format: date } }
        - { name: nama, in: query, schema: { type: string } }
        - { name: pelayanan, in: query, description: refjenisrawat id, schema: { type: integer } }
        - { name: status, in: query, description: 3 DAFTAR, 4 PROSES or 5 PAYMENT (the Proses filter), schema: { type: integer, enum: [3, 4, 5] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [id, tglMasuk, pelayanan, status, noRm, nama, umur, alamat, cabang, dokter], default: id } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 5 } }
      responses:
        '200':
          description: One page of registrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        tglMasuk: { type: string, nullable: true }
                        idJenisRawat: { type: integer, nullable: true }
                        pelayanan: { type: string }
                        isPemeriksaan: { type: boolean }
                        idStatus: { type: integer, nullable: true }
                        status: { type: string }
                        idPas: { type: integer, nullable: true }
                        noRm: { type: string }
                        nama: { type: string }
                        tglLahir: { type: string, format: date, nullable: true }
                        alamat: { type: string }
                        hp: { type: string }
                        penanggung: { type: string }
                        idJamkes: { type: integer, nullable: true }
                        jamkes: { type: string }
                        noJamkes: { type: string }
                        cabang: { type: string }
                        idDokter: { type: integer, nullable: true }
                        dokter: { type: string }
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
