  /api/report-klinik/all-stok:
    get:
      tags: [report-klinik]
      summary: All Stok, every drug at your branches with its stock movement over the period
      description: >-
        One row per stock row (trxstock: drug and branch), the dearest first. The app changes stock
        only through sales (Save takes drugs out, Cancel puts them back), so stokAkhir = current stock +
        the drugs sold after the period, jual = the drugs sold in the period (cancelled sales left out)
        and stokAwal = stokAkhir + jual. Prices are the branch's (trxstock.hbeli, hjual).
      operationId: allStok
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cabang, in: query, description: One of your branches (403 otherwise), schema: { type: string } }
        - { name: q, in: query, description: 'Drug, type, principal, distributor, branch or drug id', schema: { type: string } }
        - { name: nama, in: query, description: Drug name (Cari panel), schema: { type: string } }
        - { name: jenis, in: query, description: refjenisobat id (Cari panel), schema: { type: integer } }
        - { name: movingPo, in: query, description: refkodemovingpo id (Cari panel), schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [idObat, obat, satuanBeli, isiPerBox, satuanJual, hargaBeli, hargaJual, jenis, principal, distributor, movingPo, stokAwal, jual, stokAkhir, cabang], default: hargaJual } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 10 } }
      responses:
        '200':
          description: One page of stock rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        idObat: { type: integer, description: Kode }
                        obat: { type: string }
                        satuanBeli: { type: string }
                        isiPerBox: { type: string, description: refobat.isi_per_box (text) }
                        satuanJual: { type: string }
                        hargaBeli: { type: number }
                        hargaJual: { type: number }
                        jenis: { type: string }
                        principal: { type: string }
                        distributor: { type: string }
                        movingPo: { type: string, example: SM }
                        stokAwal: { type: number }
                        jual: { type: number }
                        stokAkhir: { type: number }
                        cabang: { type: string }
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/report-klinik/all-stok/options:
    get:
      tags: [report-klinik]
