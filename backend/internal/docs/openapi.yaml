  /api/pendaftaran:
    get:
      tags: [front-office]
      summary: One page of visit registrations at your branches
      description: |
        Server-side paging, search and sort over trxpendaftaran (~344k rows), for
        a date range in the clinic's time zone (Asia/Jakarta) and limited to the
        caller's branches. Requires the Front Office Klinik > Pendaftaran Pasien menu.
      operationId: listPendaftaran
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, description: YYYY-MM-DD; default today, schema: { type: string, format: date } }
        - { name: to, in: query, description: YYYY-MM-DD; default = from, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 10 } }
        - { name: q, in: query, description: Patient name, No RM, address, service, or No Pendaftaran, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [id, noAntri, noAntriPoli, tglMasuk, pelayanan, status, noRm, nama, tglLahir, umur, alamat, cabang, pakaiKartu, totalPoint] } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: cabang, in: query, description: One of the caller's branches (403 otherwise), schema: { type: string } }
        - { name: pelayanan, in: query, description: refjenisrawat id, schema: { type: integer } }
        - { name: status, in: query, description: refstatustransaksi id, schema: { type: integer } }
      responses:
        '200':
          description: Page of registrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pendaftaran'
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [front-office]
      summary: Register a visit
      description: |
        Assigns the next queue number of the branch and day, and the next poli
        queue number of the service (written firstcode + 3 digits, e.g. U015, for
        services that need one). The status starts as DAFTAR. The date may be
        today or earlier; the time is the clinic's current time.
      operationId: createPendaftaran
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idPas, idJenis, cabang]
              properties:
                tanggal: { type: string, format: date, description: Default today }
                idPas: { type: integer, description: refmpasien id }
                idJenis: { type: integer, description: Active refjenisrawat id (Pelayanan) }
                cabang: { type: string, description: One of the caller's branches }
                pakaiKartu: { type: boolean }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pendaftaran'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pendaftaran/options:
    get:
      tags: [front-office]
      summary: Services, visit statuses, your branches and today's clinic date
      operationId: pendaftaranOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lookup lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  pelayanan:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string, example: POLI UMUM }
                        needQueue: { type: boolean }
                        firstCode: { type: string, example: U }
                        isExamination: { type: boolean }
                  status: { $ref: '#/components/schemas/OptionList' }
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode: { type: string }
                        nama: { type: string }
                  today: { type: string, format: date }
        '401':
