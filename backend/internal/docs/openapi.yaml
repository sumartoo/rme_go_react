  /api/pengobatan/icd:
    get:
      tags: [transaksi-klinik]
      summary: ICD-X codes for the Diagnosa tab's lookup (Data Diagnosa), paged on the server
      description: Same data as /api/icd, but needs only the Pengobatan menu. Codes are not per branch.
      operationId: pengobatanIcd
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, description: 'Code, disease name or type', schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [id, kode, nama, jenis], default: id } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: One page of codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kode: { type: string, example: K04.3 }
                        nama: { type: string }
                        idJenis: { type: integer }
                        jenis: { type: string, example: GIGI }
                  total: { type: integer }
                  unfilteredTotal: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/pengobatan/pemeriksaan/{idKun}:
    parameters:
      - { name: idKun, in: path, required: true, description: trxpendaftaran id, schema: { type: integer } }
    get:
      tags: [transaksi-klinik]
      summary: The examination of a registration at your branches (trxpemeriksaan)
      description: pemeriksaan is null when none is saved yet. Another branch's registration answers 404.
      operationId: getPemeriksaan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Examination, with dokter, updatedBy and updatedAt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [transaksi-klinik]
      summary: Save the examination of a registration at your branches (insert or update trxpemeriksaan)
      description: One row per registration. Only while the visit is DAFTAR, PROSES or PAYMENT (409 otherwise).
      operationId: savePemeriksaan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keluhanUtama: { type: string, maxLength: 300 }
                anamnesis: { type: string, maxLength: 300 }
                sistole: { type: integer, nullable: true, minimum: 0, maximum: 300 }
                diastole: { type: integer, nullable: true, minimum: 0, maximum: 250 }
                beratBadan: { type: integer, nullable: true, minimum: 0, maximum: 500, description: kg }
                tinggiBadan: { type: integer, nullable: true, minimum: 0, maximum: 300, description: cm }
                suhu: { type: number, nullable: true, minimum: 25, maximum: 45, description: '°C' }
                pemeriksaanFisik: { type: string, maxLength: 300 }
                rekapHasilPenunjang: { type: string, maxLength: 300 }
                hasilPenunjang: { type: string, maxLength: 300 }
                rencanaPenatalaksanaan: { type: string, maxLength: 300 }
                hasilPemeriksaanDokter: { type: string, maxLength: 400 }
                tindakanDokter: { type: string, maxLength: 400 }
                idDokter: { type: integer, nullable: true, description: Dokter PJ (refmdokter) }
      responses:
        '200':
          description: Saved; the stored examination
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The visit is closed or cancelled
  /api/pengobatan/kuitansi/{id}:
    parameters:
      - { name: id, in: path, required: true, description: trxjual id, schema: { type: integer } }
    get:
      tags: [transaksi-klinik]
      summary: The receipt (kwitansi) data of a sale at your branches
      operationId: pengobatanKuitansi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  noKwi: { type: string }
                  tglKwi: { type: string, format: date }
                  cabang: { type: string }
                  namaCabang: { type: string }
                  noRm: { type: string }
                  pasien: { type: string }
                  biayaObat: { type: number }
                  biayaTindakan: { type: number }
                  biayaPenunjang: { type: number }
                  potongan: { type: number }
                  jumlah: { type: number, description: total minus discount }
                  noCetak: { type: string, description: 'empty until the first print' }
                  printedBy: { type: string }
                  printedAt: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pengobatan/kuitansi/{id}/cetak:
    parameters:
      - { name: id, in: path, required: true, description: trxjual id, schema: { type: integer } }
    post:
      tags: [transaksi-klinik]
      summary: Record a receipt print
      description: >-
        The first print writes trxjualcetak with no_cetak = <refbranch.kode_kwt>-YY-MM-<5 digits>,
        numbered per code and month; reprints keep it. Returns the receipt plus printedNow
        and printedUser for the printed page.
      operationId: pengobatanCetak
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receipt with its print number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pengobatan/nota/{id}:
    parameters:
      - { name: id, in: path, required: true, description: trxjual id, schema: { type: integer } }
    get:
      tags: [transaksi-klinik]
      summary: A sale with its lines, for the Print menu (A5 Reguler, A5 Bold, Thermal, A5 Summary)
      operationId: pengobatanNota
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sale header, lines, diagnoses and payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  noKwi: { type: string }
                  tgl: { type: string, nullable: true }
                  namaCabang: { type: string }
                  alamatCabang: { type: string }
                  telpCabang: { type: string }
                  namaPt: { type: string, description: company the branch is registered under }
                  noCetak: { type: string, description: print number assigned at the first print }
                  noRm: { type: string }
                  pasien: { type: string }
                  penanggung: { type: string }
                  point: { type: number, description: "the patient's points balance" }
                  dokter: { type: string }
                  pelayanan: { type: string }
                  jenisBayar: { type: string }
                  kasir: { type: string }
                  obat: { type: array, items: { type: object, properties: { nama: { type: string }, satuan: { type: string }, byk: { type: number }, harga: { type: number }, jumlah: { type: number }, ppn: { type: number }, dosis: { type: string } } } }
                  tindakan: { type: array, items: { type: object, properties: { nama: { type: string }, satuan: { type: string }, byk: { type: number }, harga: { type: number }, jumlah: { type: number }, ppn: { type: number }, dosis: { type: string } } } }
                  penunjang: { type: array, items: { type: object, properties: { nama: { type: string }, satuan: { type: string }, byk: { type: number }, harga: { type: number }, jumlah: { type: number }, ppn: { type: number }, dosis: { type: string } } } }
                  diagnosa: { type: array, items: { type: string } }
                  totObat: { type: number }
                  totTindakan: { type: number }
                  totPenunjang: { type: number }
                  total: { type: number }
                  potongan: { type: number }
                  grandTotal: { type: number }
                  pembayaran: { type: number }
                  piutang: { type: number }
                  kembalian: { type: number }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pengobatan/detail/{id}:
    parameters:
      - { name: id, in: path, required: true, description: trxjual id, schema: { type: integer } }
    get:
      tags: [transaksi-klinik]
      summary: A saved sale for the Edit page (registration, patient, lines, payment, cancel info)
      operationId: pengobatanDetail
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PengobatanDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pengobatan/detail/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, description: trxjual id, schema: { type: integer } }
    post:
      tags: [transaksi-klinik]
      summary: Cancel a sale ("Cancel Pengobatan")
      description: >-
        Sets trxjualtotal.status to 2 with cancelby (the e-mail without its domain), cancelat and
        cancelreason. Amounts and lines are kept and the registration stays CLOSE. The drugs sold
        go back into the branch stock.
      operationId: pengobatanCancel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, maxLength: 100, example: SALAH INPUT }
      responses:
        '200':
          description: The cancelled sale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PengobatanDetail' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The sale is already cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid JSON body, or one or more fields failed validation
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Field validation failed
              value:
                error: validation failed
                errors:
                  password: Password must be at least 8 characters
                  confirmPassword: Passwords do not match
            invalidJson:
              summary: Body is not valid JSON
              value:
                error: invalid JSON body
    Unauthorized:
      description: Missing, invalid or expired bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error: missing bearer token
            invalid:
              value:
                error: invalid or expired token
    Forbidden:
      description: The caller's role cannot open the menu item this endpoint belongs to
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: your role cannot access this page
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error

  schemas:
    PengobatanDetail:
      type: object
      properties:
        id: { type: integer }
        noKwi: { type: string }
        tglKwi: { type: string, format: date, nullable: true }
        cabang: { type: string }
        idJenisRawat: { type: integer, nullable: true }
        idJenisBayar: { type: integer, nullable: true }
        idDokter: { type: integer, nullable: true }
        dokter: { type: string }
        status: { type: string, enum: [open, close, cancel] }
        cancelBy: { type: string }
        cancelAt: { type: string, nullable: true }
        cancelReason: { type: string }
        reg: { type: object, nullable: true, description: the registration with its patient (same fields as the registration lookup) }
        obat: { type: array, items: { type: object, properties: { idObat: { type: integer }, nama: { type: string }, jenis: { type: string }, satuan: { type: string }, harga: { type: number }, byk: { type: number }, kenaPajak: { type: boolean }, ppn: { type: number }, dosis: { type: string } } } }
        tindakan: { type: array, items: { $ref: '#/components/schemas/PengobatanDetailLine' } }
        penunjang: { type: array, items: { $ref: '#/components/schemas/PengobatanDetailLine' } }
        diagnosa: { type: array, items: { type: object, properties: { id: { type: integer }, kode: { type: string }, nama: { type: string }, jenis: { type: string } } } }
        totObat: { type: number }
        totTindakan: { type: number }
        totPenunjang: { type: number }
        total: { type: number }
        potongan: { type: number }
        grandTotal: { type: number }
        pembayaran: { type: number }
        piutang: { type: number }
        kembalian: { type: number }
    PengobatanDetailLine:
      type: object
      properties:
        id: { type: integer }
        nama: { type: string }
        jenis: { type: string }
        dokter: { type: string }
        harga: { type: number }
        byk: { type: number }
        isEdit: { type: boolean }
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: password123
        confirmPassword:
          type: string
          format: password
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: password123

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: alice@example.com

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: HS256 JWT with claims sub (user id), email, iat, exp
        expiresAt:
          type: string
          format: date-time

    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: alice@example.com
        message:
          type: string
          example: Hello alice@example.com, welcome back

    MenuItem:
      type: object
      properties:
        id:
          type: integer
          example: 2
        title:
          type: string
          example: Master Data
        icon:
          type: string
          description: Icon name the frontend maps to an icon
          example: database
        path:
          type: string
          nullable: true
          description: Frontend route; null for a group without its own page
          example: null
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Perawat
        allAccess:
          type: boolean
          description: Every active menu, including menus added later
        menuIds:
          type: array
          description: Granted menu ids. A group id grants everything under it
          items:
            type: integer
          example: [1, 21, 30]
        userCount:
          type: integer
          example: 1

    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Kasir
        allAccess:
          type: boolean
          default: false
        menuIds:
          type: array
          items:
            type: integer
          example: [1, 21]

    UserRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: perawat@medika.com
        roleId:
          type: integer
          nullable: true
          example: 3
        branches:
          type: array
          description: Branch codes from refbranchauth, sorted
          items:
            type: string
          example: [MED, PRM]

    Branch:
      type: object
      description: A row of the refbranch table. Empty strings stand for NULL.
      properties:
        id:
          type: integer
          example: 1
        kode:
          type: string
          example: CTM
        nama:
          type: string
          example: KLINIK CITRA MEDIKA
        alamat:
          type: string
        telp:
          type: string
        kodeKwt:
          type: string
          description: kode_kwt (may differ from kode)
          example: CTM
        npwp:
          type: string
        namaNpwp:
          type: string
        dbHbee:
          type: string
          example: t79144_medika
        kodeFasyankes:
          type: string
          example: '31710300339'
        namaFasyankes:
          type: string
          example: KLINIK PRATAMA CITRA MEDIKA
        clientKey:
          type: string
        secretKeySet:
          type: boolean
        secretKeyHint:
          type: string
          description: Last 4 characters of the secret key (empty when unset or short)
          example: ZAs1
        organizationId:
          type: string
          example: '100468100'
        isActive:
          type: boolean
          description: isactive = 1
        isInternal:
          type: boolean
          description: isinternal = 1 (own clinic) or 0 (partner)

    BranchInput:
      type: object
      required: [kode, nama]
      description: Lengths follow the varchar sizes of refbranch. Empty values are stored as NULL.
      properties:
        kode:
          type: string
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
          description: Create only; stored uppercase; must be unique
          example: CTM
        nama:
          type: string
          maxLength: 50
          example: KLINIK CITRA MEDIKA
        alamat:
          type: string
          maxLength: 200
        telp:
          type: string
          maxLength: 200
        kodeKwt:
          type: string
          maxLength: 10
        npwp:
          type: string
          maxLength: 50
        namaNpwp:
          type: string
          maxLength: 100
        dbHbee:
          type: string
          maxLength: 50
        kodeFasyankes:
          type: string
          maxLength: 50
        namaFasyankes:
          type: string
          maxLength: 100
        clientKey:
          type: string
          maxLength: 100
        secretKey:
          type: string
          format: password
          maxLength: 100
          description: On update, leave empty to keep the stored key
        organizationId:
          type: string
          maxLength: 100
        isActive:
          type: boolean
          default: false
        isInternal:
          type: boolean
          default: false

    OptionList:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string

    ObatStock:
      type: object
      description: A trxstock row
      properties:
        cabang: { type: string, example: MED }
        stok: { type: number, nullable: true, example: 505 }
        stokMin: { type: number, nullable: true }
        hbeli: { type: number, nullable: true }
        hp: { type: number, nullable: true }
        hjual: { type: number, nullable: true, example: 175000 }
        isActive: { type: boolean }

    ObatStockInput:
      type: object
      properties:
        stok: { type: number, minimum: 0, nullable: true }
        stokMin: { type: number, minimum: 0, nullable: true }
        hbeli: { type: number, minimum: 0, nullable: true }
        hp: { type: number, minimum: 0, nullable: true }
        hjual: { type: number, minimum: 0, nullable: true }
        isActive: { type: boolean }

    ObatInput:
      type: object
      required: [nama]
      description: Editable refobat columns. Lookup ids must exist (see /api/obat/options).
      properties:
        nama: { type: string, maxLength: 100, example: PARACETAMOL 500 MG }
        isi: { type: string, maxLength: 10 }
        isiPerBox: { type: string, maxLength: 20 }
        idJenis: { type: integer, nullable: true }
        idLogo: { type: integer, nullable: true }
        idProd: { type: integer, nullable: true }
        satBeli: { type: integer, nullable: true }
        satJual: { type: integer, nullable: true }
        idMoving: { type: integer, nullable: true }
        idMovingPo: { type: integer, nullable: true }
        idDistributor: { type: integer, nullable: true }
        idPrincipal: { type: integer, nullable: true }
        idGolongan: { type: integer, nullable: true }
        qjb: { type: number, minimum: 0, nullable: true }
        hbeli: { type: number, minimum: 0, nullable: true }
        hjual: { type: number, minimum: 0, nullable: true }
        hp: { type: number, minimum: 0, nullable: true }
        nonAktif: { type: boolean }
        kenaPajak: { type: boolean }
        komposisi: { type: string, maxLength: 5000 }

    Obat:
      allOf:
        - $ref: '#/components/schemas/ObatInput'
        - type: object
          properties:
            id: { type: integer, example: 1 }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time, nullable: true }
            stocks:
              type: array
              items:
                $ref: '#/components/schemas/ObatStock'

    TindakanPriceInput:
      type: object
      properties:
        hbeli: { type: number, minimum: 0, nullable: true }
        hjual: { type: number, minimum: 0, nullable: true }
        hjualJamkes: { type: number, minimum: 0, nullable: true, description: Price for health-insurance (jamkes) patients }
        isActive: { type: boolean }

    TindakanPrice:
      allOf:
        - type: object
          properties:
            cabang: { type: string, example: MED }
        - $ref: '#/components/schemas/TindakanPriceInput'

    TindakanInput:
      type: object
      required: [nama]
      properties:
        nama: { type: string, maxLength: 100, example: JASA KONSULTASI DOKTER UMUM }
        idJenis: { type: integer, nullable: true }
        hbeli: { type: number, minimum: 0, nullable: true }
        hjual: { type: number, minimum: 0, nullable: true }
        hjualJamkes: { type: number, minimum: 0, nullable: true }
        isActive: { type: boolean }
        isEdit: { type: boolean, description: isedit flag }
        cetakKartu: { type: boolean, description: sts_ctk_krtu flag }

    Tindakan:
      allOf:
        - $ref: '#/components/schemas/TindakanInput'
        - type: object
          properties:
            id: { type: integer, example: 1 }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time, nullable: true }
            prices:
              type: array
              items:
                $ref: '#/components/schemas/TindakanPrice'

    PenunjangPriceInput:
      type: object
      properties:
        hjual: { type: number, minimum: 0, nullable: true }
        hjualJamkes: { type: number, minimum: 0, nullable: true, description: Price for health-insurance (jamkes) patients }
        isActive: { type: boolean }

    PenunjangPrice:
      allOf:
        - type: object
          properties:
            cabang: { type: string, example: MED }
        - $ref: '#/components/schemas/PenunjangPriceInput'

    PenunjangInput:
      type: object
      required: [nama]
      properties:
        nama: { type: string, maxLength: 100, example: ASAM URAT }
        idJenis: { type: integer, nullable: true, description: refjenispanjang id }
        hjual: { type: number, minimum: 0, nullable: true }
        hjualJamkes: { type: number, minimum: 0, nullable: true }
        isActive: { type: boolean }

    Penunjang:
      allOf:
        - $ref: '#/components/schemas/PenunjangInput'
        - type: object
          properties:
            id: { type: integer, example: 1 }
