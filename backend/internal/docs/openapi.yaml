  /api/pasien:
    get:
      tags: [master-data]
      summary: One page of patients from your branches
      description: |
        Server-side paging, search and sort over refmpasien (~430k rows), limited
        to the branches the caller is mapped to. Requires the Master Data Klinik >
        Pasien menu.
      operationId: listPasien
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 10 } }
        - { name: q, in: query, description: Matches name, No RM, NIK or address; a number also matches Kode, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [id, noRm, nama, tmptLahir, tglLahir, umur, alamat, rt, rw, cabang], default: id } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] }, description: Default desc when sort is omitted (newest first) }
        - { name: cabang, in: query, description: One of the caller's branches (403 otherwise), schema: { type: string } }
      responses:
        '200':
          description: Page of patients
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/PasienRow'
                  total: { type: integer, description: Rows matching the search }
                  unfilteredTotal: { type: integer, description: Rows in the branches without the search }
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode: { type: string }
                        nama: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [master-data]
      summary: Register a patient
      description: No RM is generated (the branch's newest number + 1, skipping used ones). The branch must be one of the caller's.
      operationId: createPasien
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasienInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pasien'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pasien/options:
    get:
      tags: [master-data]
      summary: Lookup lists for the patient form, and your branches
      operationId: pasienOptions
      security:
