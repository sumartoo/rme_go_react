openapi: 3.0.3
info:
  title: JWT Auth API
  version: 1.0.0
  description: |
    Register, log in and access protected endpoints with a JWT (HS256).

    To call a protected endpoint: run **POST /api/auth/login**, copy `token`
    from the response, click **Authorize** and paste it (without the `Bearer ` prefix).
servers:
  - url: /
    description: Same origin as this page

tags:
  - name: auth
    description: Registration, login and token refresh
  - name: user
    description: Endpoints that require a valid token
  - name: admin
    description: |
      Role management. Access follows the menu: a caller whose role can open
      Management > Role (`/management/role`) can use the role endpoints, and
      Management > User (`/management/user`) the user endpoints. Others get 403.
  - name: master-data
    description: |
      Master data pages. Access follows the page's menu item; stock and prices
      per branch are limited to the branches the caller is mapped to.
  - name: setting
    description: Setting pages (MCU prices and options). Access follows the page's menu item.
  - name: front-office
    description: Front Office Klinik pages; limited to the caller's branches.
  - name: transaksi-klinik
    description: Transaksi Klinik pages; limited to the caller's branches.
  - name: report-klinik
    description: Report Klinik pages; limited to the caller's branches.
  - name: system
    description: Operational endpoints

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        The email is trimmed and stored lowercase. The password must be 8–72
        characters and `confirmPassword` must match it.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: email already registered
                errors:
                  email: Email is already registered
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and get a token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password (same message for both, on purpose)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid email or password
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a still-valid token for a new one
      description: Sliding expiration. An expired token cannot be refreshed; log in again.
      operationId: refresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me:
    get:
      tags: [user]
      summary: Current user
      description: Returns the identity stored in the token.
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/menus:
    get:
      tags: [user]
      summary: Sidebar menu
      description: |
        Active rows of the `menus` table as a tree, ordered by `sort_order`,
        limited to what the caller's role grants (see `roles` / `role_menus`).
        An item is hidden when it or any of its ancestors has `is_active = false`.
        A user without a role gets an empty list.
      operationId: listMenus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Menu tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
                  role:
                    type: string
                    nullable: true
                    description: Name of the caller's role; null if they have none
                    example: Perawat
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/roles:
    get:
      tags: [admin]
      summary: List roles
      description: Every role, plus the full active menu tree to pick menus from.
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles and menu tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: Create a role
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A role with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [admin]
      summary: Update a role
      description: |
        Replaces the name, `allAccess` and the granted menus. Editing your own
        role so that it no longer reaches Management > Role is refused with 400.
      operationId: updateRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A role with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      tags: [admin]
      summary: Delete a role
      operationId: deleteRole
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The role is still assigned to users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags: [admin]
      summary: List users with their role
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users, and the roles and branches they can be given
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserRole'
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode:
                          type: string
                          example: MED
                        nama:
                          type: string
                          example: KLINIK MEDIKA
                        isActive:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}/menus:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [admin]
      summary: Menus a user gets from their role
      description: |
        The menu tree this user sees in their sidebar, computed the same way as
        GET /api/menus. A user without a role gets an empty list and role null.
      operationId: userMenus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Menu tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    nullable: true
                    example: Perawat
                  allAccess:
                    type: boolean
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/branches:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [admin]
      summary: Set the branches a user belongs to
      description: |
        Replaces the user's rows in `refbranchauth`. A user can belong to several
        branches; an empty list removes them all. Codes are trimmed, uppercased
        and de-duplicated. Changing your own branches is allowed.
      operationId: setUserBranches
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branches]
              properties:
                branches:
                  type: array
                  items:
                    type: string
                    maxLength: 10
                  example: [MED, PRM]
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  branches:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [admin]
      summary: Change a user's role
      description: You cannot change your own role (400).
      operationId: setUserRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
                  nullable: true
                  description: null removes the role (the user then sees no menus)
                  example: 3
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  roleId:
                    type: integer
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/branches:
    get:
      tags: [admin]
      summary: List branches
      description: |
        Clinic branches ordered by name. Requires the Management > Cabang menu
        (`/management/cabang`). The secret key is never returned, only whether
        it is set and its last 4 characters.
      operationId: listBranches
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: Create a branch
      operationId: createBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The branch code is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/branches/{kode}:
    parameters:
      - name: kode
        in: path
        required: true
        description: Branch code (primary key of refbranch)
        schema:
          type: string
          example: CTM
    put:
      tags: [admin]
      summary: Update a branch
      description: |
        The kode cannot change: a `kode` in the body is ignored.
        An empty or missing `secretKey` keeps the stored key.
      operationId: updateBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The branch code is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/obat:
    get:
      tags: [master-data]
      summary: List drugs with stock at your branches
      description: |
        Every drug in refobat. `stocks` holds trxstock rows only for the branches
        the caller is mapped to (refbranchauth), which are also returned in
        `branches`. Requires the Master Data Klinik > Obat menu.
      operationId: listObat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Drugs and the caller's branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  obat:
                    type: array
                    items:
                      $ref: '#/components/schemas/Obat'
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode:
                          type: string
                          example: MED
                        nama:
                          type: string
                          example: KLINIK MEDIKA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [master-data]
      summary: Create a drug
      operationId: createObat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObatInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/obat/options:
    get:
      tags: [master-data]
      summary: Lookup lists for the drug form
      operationId: obatOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One list of {id, name} per lookup table
          content:
            application/json:
              schema:
                type: object
                properties:
                  jenis: { $ref: '#/components/schemas/OptionList' }
                  satuan: { $ref: '#/components/schemas/OptionList' }
                  logo: { $ref: '#/components/schemas/OptionList' }
                  produsen: { $ref: '#/components/schemas/OptionList' }
                  moving: { $ref: '#/components/schemas/OptionList' }
                  movingPo: { $ref: '#/components/schemas/OptionList' }
                  distributor: { $ref: '#/components/schemas/OptionList' }
                  principal: { $ref: '#/components/schemas/OptionList' }
                  golongan: { $ref: '#/components/schemas/OptionList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/obat/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [master-data]
      summary: Update a drug
      operationId: updateObat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObatInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/obat/{id}/stock/{cabang}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: cabang
        in: path
        required: true
        description: Branch code; must be one of the caller's branches
        schema:
          type: string
          example: MED
    put:
      tags: [master-data]
      summary: Set a drug's stock and prices at one branch
      description: Creates or updates the trxstock row. 403 when the caller is not mapped to the branch.
      operationId: setObatStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObatStockInput'
      responses:
        '200':
          description: The drug with its updated stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tindakan:
    get:
      tags: [master-data]
      summary: List procedures with prices at your branches
      description: |
        Every procedure in reftindakan. `prices` holds reftindakandetail rows only
        for the branches the caller is mapped to (refbranchauth), which are also
        returned in `branches`. Requires the Master Data Klinik > Tindakan menu.
      operationId: listTindakan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Procedures and the caller's branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  tindakan:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tindakan'
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode: { type: string, example: MED }
                        nama: { type: string, example: KLINIK MEDIKA }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [master-data]
      summary: Create a procedure
      operationId: createTindakan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TindakanInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tindakan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tindakan/options:
    get:
      tags: [master-data]
      summary: Procedure types (refjenistindakan)
      operationId: tindakanOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lookup list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jenis: { $ref: '#/components/schemas/OptionList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tindakan/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [master-data]
      summary: Update a procedure
      operationId: updateTindakan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TindakanInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tindakan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tindakan/{id}/price/{cabang}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: cabang
        in: path
        required: true
        description: Branch code; must be one of the caller's branches
        schema:
          type: string
          example: MED
    put:
      tags: [master-data]
      summary: Set a procedure's prices at one branch
      description: Creates or updates the reftindakandetail row. 403 when the caller is not mapped to the branch.
      operationId: setTindakanPrice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TindakanPriceInput'
      responses:
        '200':
          description: The procedure with its updated prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tindakan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/penunjang:
    get:
      tags: [master-data]
      summary: List supporting examinations with prices at your branches
      description: |
        Every examination in refpenunjang. `prices` holds refpenunjangdetail rows
        only for the branches the caller is mapped to (refbranchauth), which are
        also returned in `branches`. The lab tables have no purchase price.
        Requires the Master Data Klinik > Penunjang menu.
      operationId: listPenunjang
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Examinations and the caller's branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  penunjang:
                    type: array
                    items:
                      $ref: '#/components/schemas/Penunjang'
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode: { type: string, example: MED }
                        nama: { type: string, example: KLINIK MEDIKA }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [master-data]
